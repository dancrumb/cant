packages:
  - packages/*
allowBuilds:
  '@vscode/vsce-sign': true
  esbuild: true
versioning:
  # Release all the packages together at one shared version.
  fixed:
    - - 'cant'
      - '@dancrumb/cant-compiler'
      - '@dancrumb/cant-interpreter'
      - '@dancrumb/cant-lsp'
      - '@dancrumb/cant-native'
      - '@dancrumb/cant-shared'
      - 'cant-vscode'
  # Commit a CHANGELOG.md in each package.
  changelog:
    storage: repository
