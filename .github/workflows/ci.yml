name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same pull request or branch replaces a run that hasn't finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Every .cant file in the repository must be formatted (docs/adr/0041-formatting.md).
      - name: Check formatting
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Catch problems that would only show up when the extension is packaged for a release.
      - name: Package extension
        run: pnpm --filter cant-vscode run package
