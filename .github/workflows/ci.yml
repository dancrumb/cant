name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push to the same pull request or branch replaces a run that hasn't finished.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # A release commit is pushed with its version tag, and the tag runs the publish workflow, which
  # does everything CI does. So CI skips a pushed commit that has a version tag.
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.tags.outputs.tagged }}
    steps:
      - name: Look for a version tag
        id: tags
        run: |
          # An annotated tag's peeled line (`refs/tags/v1.2.3^{}`) names the commit it tags.
          if git ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" | grep -qE "^$GITHUB_SHA\s+refs/tags/v[0-9]"; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: release
    # Runs for pull requests, where `release` is skipped, and for pushes without a version tag.
    if: ${{ !cancelled() && needs.release.outputs.tagged != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # Every .cant file in the repository must be formatted (docs/adr/0041-formatting.md).
      - name: Check formatting
        run: pnpm fmt:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Catch problems that would only show up when the extension is packaged for a release.
      - name: Package extension
        run: pnpm --filter cant-vscode run package
